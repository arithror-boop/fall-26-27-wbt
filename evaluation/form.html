<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Donor Information</h1>
    <form>
        <table>
            <tr>
                <td>First Name*</td>
                <td><input type="text" id="fname" name="fname" required></td>
            </tr>
            <tr>
                <td>Last Name*</td>
                <td><input type="text" id="lname" name="lname" required></td>
            </tr>
            <tr>
                <td>Company</td>
                <td><input type="text" id="company" name="company"></td>
            </tr>
            <tr>
                <td>Address 1*</td>
                <td><input type="text" id="address 1" name="address 1" required></td>
            </tr>
            <tr>
                <td>Address 2</td>
                <td><input type="text" id="address 2" name="address 2"></td>
            </tr>
            <tr>
                <td>City*</td>
                <td><input type="text" id="city" name="city" required></td>
            </tr>
            <tr>
                <td><label for="State">State*</label></td>
                <td>
                    <Select id="state" name="state" Required>
                        <option>Select a State</option>
                        <option>Dhaka</option>
                        <option>Chittagong</option>
                        <option>Dinajpur</option>
                        <option>Khulna</option>
                    </Select>
                </td>
            </tr>
            <tr>
                <td>Zip Code*</td>
                <td><input type="number" id="zip Code " name="zip Code" required></td>
            </tr>
            <tr>
                <td><label for="Country">Country*</label></td>
                <td>
                    <Select id="country" name="country" Required>
                        <option>Select a Country</option>
                        <option>Bangladesh</option>
                        <option>UK</option>
                        <option>USA</option>
                        <option>Uganda</option>
                    </Select>
                </td>
            </tr>
            <tr>
                <td>Phone</td>
                <td><input type="tel" id="pone" name="phone" required></td>
            </tr>
            <tr>
                <td>Fax*</td>
                <td><input type="text" id="fax" name="fax" required></td>
            </tr>
            <tr>
                <td><label for="email">Email*</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td><label for="damount">Donation Amount*<br>(Check a button or type in your amount)</label></td>
                <td>
                    <input type="radio" name="damount" value="none">None
                    <input type="radio" name="damount" value="$50">$50
                    <input type="radio" name="damount" value="$75">$75
                    <input type="radio" name="damount" value="$100">$100
                    <input type="radio" name="damount" value="$250">$250
                    <input type="radio" name="damount" value="Other">Other
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="other amount">Other Amount$</label>
                    <input type="number" id="other amount" name="other amount" required>
                </td>
            </tr>
            <tr>
                <td><label for="rdonation">Requiring Donation<br>(Check if yes)</label></td>
                <td>
                    <input type="checkbox" value="i am intrested in giving on a regular basis"> I am intrested in giving
                    on a regular basis
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="monthly credit card">Monthly Credit Card$</label>
                    <input type="number" id="monthly credit card" name="monthly credit card">
                    <label for="for">For</label>
                    <input type="text" id="for" name="for">
                    <label for="months">Months</label>
                </td>
            </tr>
        </table>
        <h1>Honorarium and Memorial Donation Information</h1>
        <table>
            <tr>
                <td><label for="i would like to make this donation">I would like to make this<br>donation</label></td>
                <td>
                    <input type="radio" name="i would like to make this donation" value="to honor">To Honor
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="radio" name="i would like to make this donation" value="in memory of">In Memory of
                </td>
            </tr>
            <tr>
                <td>Name</td>
                <td><input type="text" id="name" name="name"></td>
            </tr>
            <tr>
                <td>Acknowledge Donation to</td>
                <td><input type="text" id="acknowledge donation to" name="acknowledge donation to"></td>
            </tr>
            <tr>
                <td>Address</td>
                <td><input type="text" id="address" name="address"></td>
            </tr>
            <tr>
                <td>City</td>
                <td><input type="text" id="city" name="city"></td>
            </tr>
            <tr>
                <td><label for="State">State</label></td>
                <td>
                    <Select id="state" name="state">
                        <option>Select a State</option>
                        <option>Dhaka</option>
                        <option>Chittagong</option>
                        <option>Dinajpur</option>
                        <option>Khulna</option>
                    </Select>
                </td>
            </tr>
            <tr>
                <td>Zip</td>
                <td><input type="number" id="zip" name="zip"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="Submit" value="Register">
                    <input type="reset">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
